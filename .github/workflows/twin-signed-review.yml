      - name: Sign B evidence via GitHub OIDC / Sigstore
        id: attest_b
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # verified v4 commit
        with:
          subject-path: ${{ runner.temp }}/attestation-B.json
      - name: Verify genuine signed B evidence with patched GitHub CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
