              assert len(statement['subject'])==1
              assert statement['subject'][0]['digest']['sha256']==digest
          print("SIGNED_VERIFICATION_B=PASS")
          print("SIGNED_SUBJECT_B_SHA256="+digest)
          PY_VERIFY
      - name: Upload individual B JSON evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-crosshost-B
          path: |
            ${{ runner.temp }}/attestation-B.json
            ${{ runner.temp }}/verified-B.json
            ${{ steps.attest_b.outputs.bundle-path }}
          retention-days: 7
          if-no-files-found: error
