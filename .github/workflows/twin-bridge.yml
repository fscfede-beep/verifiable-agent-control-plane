name: Twin Bridge Verification

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "twin/**"
      - ".agents/plugins/**"
      - "plugins/**"
      - "tests/**"
      - "twin_control_plane/**"
      - "twin_sync/**"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: twin-bridge
  cancel-in-progress: false

jobs:
  equivalence:
    name: Two isolated worktrees and fail-closed A/B equivalence
    # Both attested twins report the same actual host kernel (not a normalized substitute).
    # Worktrees and virtual environments remain isolated.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.17'

      - name: Prepare isolated checkouts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TWIN_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          TWIN_SOURCE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          TWIN_SOURCE_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          # Reject forks until an explicitly reviewed fork-provenance policy exists.
          test "$TWIN_SOURCE_REPO" = "$GITHUB_REPOSITORY"
          [[ "$TWIN_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git check-ref-format --branch "$TWIN_SOURCE_BRANCH" >/dev/null
          test "$(git rev-parse HEAD)" = "$TWIN_SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TWIN_SOURCE_BRANCH" --jq '.object.sha')" = "$TWIN_SOURCE_SHA"
          for twin in A B; do
            clone="$RUNNER_TEMP/rumbo-twin-$twin"
            # Independent .git directories let both twins name the same real branch.
            git clone --quiet --no-local --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" "$clone"
            git -C "$clone" switch --quiet --create "$TWIN_SOURCE_BRANCH" "$TWIN_SOURCE_SHA"
            git -C "$clone" remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
            test "$(git -C "$clone" rev-parse HEAD)" = "$TWIN_SOURCE_SHA"
            test "$(git -C "$clone" branch --show-current)" = "$TWIN_SOURCE_BRANCH"
            test "$(git -C "$clone" config --get remote.origin.url)" = "https://github.com/$GITHUB_REPOSITORY.git"
            test -z "$(git -C "$clone" status --porcelain --untracked-files=all)"
          done

      - name: Independently validate and attest Twin A and Twin B
        shell: bash
        run: |
          set -euo pipefail
          for twin in A B; do
            worktree="$RUNNER_TEMP/rumbo-twin-$twin"
            venv="$RUNNER_TEMP/rumbo-venv-$twin"
            if [[ "$twin" == "A" ]]; then role=primary; else role=twin; fi
            python -m venv "$venv"
            # Activate to ensure collector's subprocess calls use the correct twin Python.
            source "$venv/bin/activate"
            cd "$worktree"
            python -m pip install .
            python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.agents/plugins/marketplace.json').read_text(encoding='utf-8'))
          assert data['name'] == 'rumbo-twin-plugins'
          names = {p['name'] for p in data['plugins']}
          assert {'twin-control-plane', 'twin-sync'} <= names
          for item in data['plugins']:
              assert (Path(item['source']['path']) / '.codex-plugin' / 'plugin.json').exists()
          print('plugin manifests: PASS')
          PY
            python -m unittest discover -s tests -v
            python twin/twin-doctor.py
            python - <<'PY'
          from pathlib import Path
          text = Path('twin/ENVIRONMENT_BRIDGE.md').read_text(encoding='utf-8')
          required = ['repository commit SHA', 'TwinSpec digest', 'tool-policy digest',
                      'runtime version', 'required test status', 'FAIL-CLOSED']
          assert not [x for x in required if x not in text]
          print('bridge contract: PASS')
          PY
            # Collector reruns required tests and refuses dirty worktrees.
            python twin/collect_attestation.py \
              --role "$role" --id "$twin" \
              --out "$RUNNER_TEMP/$twin.attestation.json"
            deactivate
            cd "$GITHUB_WORKSPACE"
          done

      - name: Run unchanged strict A/B equivalence gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TWIN_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          TWIN_SOURCE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TWIN_SOURCE_BRANCH" --jq '.object.sha')" = "$TWIN_SOURCE_SHA"
          python twin/attestation-gate.py \
            "$RUNNER_TEMP/A.attestation.json" \
            "$RUNNER_TEMP/B.attestation.json"

      - name: Upload Twin A attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twin-attestation-A
          path: ${{ runner.temp }}/A.attestation.json
          if-no-files-found: warn

      - name: Upload Twin B attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twin-attestation-B
          path: ${{ runner.temp }}/B.attestation.json
          if-no-files-found: warn
