name: Twin Bridge Verification

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/**"
      - "twin/**"
      - ".agents/plugins/**"
      - "plugins/**"
      - "tests/**"
      - "twin_control_plane/**"
      - "twin_sync/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  twin:
    name: Twin ${{ matrix.environment_id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment_role: primary
            environment_id: A
          - environment_role: twin
            environment_id: B
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install .

      - name: Validate plugin manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          mp = Path(".agents/plugins/marketplace.json")
          data = json.loads(mp.read_text(encoding="utf-8"))
          assert data["name"] == "rumbo-twin-plugins"
          names = {p["name"] for p in data["plugins"]}
          assert {"twin-control-plane", "twin-sync"} <= names
          for item in data["plugins"]:
              assert (Path(item["source"]["path"]) / ".codex-plugin" / "plugin.json").exists()
          print("plugin manifests: PASS")
          PY

      - name: Run regression suite
        run: python -m unittest discover -s tests -v

      - name: Run twin doctor
        run: python twin/twin-doctor.py

      - name: Verify bridge contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("twin/ENVIRONMENT_BRIDGE.md").read_text(encoding="utf-8")
          required = [
              "repository commit SHA",
              "TwinSpec digest",
              "tool-policy digest",
              "runtime version",
              "required test status",
              "FAIL-CLOSED",
          ]
          missing = [x for x in required if x not in text]
          assert not missing, missing
          print("bridge contract: PASS")
          PY

      - name: Collect environment attestation
        run: |
          python twin/collect_attestation.py \
            --role "${{ matrix.environment_role }}" \
            --id "${{ matrix.environment_id }}" \
            --out "/tmp/${{ matrix.environment_id }}.attestation.json"

      - name: Upload attestation
        uses: actions/upload-artifact@v4
        with:
          name: twin-attestation-${{ matrix.environment_id }}
          path: /tmp/${{ matrix.environment_id }}.attestation.json
          if-no-files-found: error

  gate:
    name: A/B equivalence gate
    runs-on: ubuntu-latest
    needs: twin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download A attestation
        uses: actions/download-artifact@v4
        with:
          name: twin-attestation-A
          path: attestations/A

      - name: Download B attestation
        uses: actions/download-artifact@v4
        with:
          name: twin-attestation-B
          path: attestations/B

      - name: Run fail-closed A/B gate
        run: |
          python twin/attestation-gate.py \
            attestations/A/A.attestation.json \
            attestations/B/B.attestation.json
