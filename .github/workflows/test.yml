name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package from source
        run: python -m pip install .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify installed import outside checkout
        shell: bash
        run: |
          cd /tmp
          python - <<'PY'
          import verifiable_agent_control_plane as vacp
          import verifiable_control_plane as legacy
          assert legacy.materialize is vacp.materialize
          assert legacy.verify_transition is vacp.verify_transition
          PY
