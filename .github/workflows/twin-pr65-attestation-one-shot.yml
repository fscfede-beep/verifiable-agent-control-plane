        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-signed-B
          path: |
            ${{ runner.temp }}/candidate-B/attestation-B.json
            ${{ runner.temp }}/verified-B.json
            ${{ steps.signed.outputs.bundle-path }}
          retention-days: 7
          if-no-files-found: error

  verify-independent:
    name: independent-readonly-root-and-twin
    needs: [sign-a, sign-b]
    if: ${{ needs.sign-a.result == 'success' && needs.sign-b.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: e89542a4c98e798204ec4a8dd5cc4bab3d325c40
      - name: Independently verify TUF trust and both signed PR65 documents
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo='fscfede-beep/verifiable-agent-control-plane'
          target='e89542a4c98e798204ec4a8dd5cc4bab3d325c40'
          target_branch='test/twin-collector-postsuite-20261029'
          test "$(git rev-parse HEAD)" = "$target"
          test "$(gh api "repos/$repo/git/ref/heads/$target_branch" --jq '.object.sha')" = "$target"
          gh version | head -1 | python -c 'import re,sys;s=sys.stdin.read().strip();m=re.fullmatch(r"gh version ([0-9]+)[.]([0-9]+)[.]([0-9]+)(?: [(].*[)])?",s);assert m and int(m[1])==2 and int(m[2])>=102,"UNPATCHED_GH"'
          gh attestation trusted-root > "$RUNNER_TEMP/trusted-root.jsonl"
          gh attestation trusted-root --verify-only > "$RUNNER_TEMP/root-check.log"
          test -s "$RUNNER_TEMP/trusted-root.jsonl"
          python - <<'PY_ROOT'
          import json,os,pathlib
          lines=(pathlib.Path(os.environ['RUNNER_TEMP'])/'trusted-root.jsonl').read_text().splitlines()
          assert lines and all(isinstance(json.loads(x),dict) for x in lines if x.strip())
          print('PR65_TRUSTED_TUF_ROOT=PASS')
          PY_ROOT
          for side in A B; do
            mkdir -p "$RUNNER_TEMP/$side"
            gh run download "$GITHUB_RUN_ID" --repo "$repo" --name "isolated-signed-$side" --dir "$RUNNER_TEMP/$side"
            test -s "$RUNNER_TEMP/$side/candidate-$side/attestation-$side.json"
            cp "$RUNNER_TEMP/$side/candidate-$side/attestation-$side.json" "$RUNNER_TEMP/$side/attestation-$side.json"
            python - "$RUNNER_TEMP/$side" "$side" <<'PY_BUNDLE'
          import pathlib,sys,shutil
          directory=pathlib.Path(sys.argv[1]);side=sys.argv[2]
          matches=list(directory.glob('*/attestation.json'))
          assert len(matches)==1,'UNEXPECTED_BUNDLE_COUNT'
          shutil.copyfile(matches[0],directory/(side+'.bundle.json'))
          PY_BUNDLE
            gh attestation verify "$RUNNER_TEMP/$side/attestation-$side.json" \
              --bundle "$RUNNER_TEMP/$side/$side.bundle.json" \
              --custom-trusted-root "$RUNNER_TEMP/trusted-root.jsonl" \
              --repo "$repo" \
              --signer-workflow "$repo/.github/workflows/twin-pr65-attestation-one-shot.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners \
              --cert-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --format json > "$RUNNER_TEMP/$side/verified.json"
            python - "$RUNNER_TEMP/$side" "$side" <<'PY_CHECK'
          import hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1]);side=sys.argv[2]
          report=p/('attestation-'+side+'.json')
          obj=json.loads(report.read_bytes())
          results=json.loads((p/'verified.json').read_bytes())
          digest=hashlib.sha256(report.read_bytes()).hexdigest()
          assert isinstance(results,list) and len(results)==1
          cert=results[0]['verificationResult']['signature']['certificate']
          assert str(cert['sourceRepositoryIdentifier'])=='1356103408'
          stmt=results[0]['verificationResult']['statement']
          assert stmt['predicateType']=='https://slsa.dev/provenance/v1'
          assert len(stmt['subject'])==1 and stmt['subject'][0]['digest']['sha256']==digest
          assert obj['commit']=='e89542a4c98e798204ec4a8dd5cc4bab3d325c40'
          assert obj['branch']=='test/twin-collector-postsuite-20261029'
          assert (obj['environment_role'],obj['environment_id'])==(('primary','A') if side=='A' else ('twin','B'))
          assert obj['tests']=='PASS' and obj['working_tree_clean'] is True
          print('PR65_INDEPENDENT_SIGNATURE_'+side+'=PASS')
          print('PR65_SUBJECT_SHA256_'+side+'='+digest)
          PY_CHECK
          done
          python twin/attestation-gate.py "$RUNNER_TEMP/A/attestation-A.json" "$RUNNER_TEMP/B/attestation-B.json"
          test "$(gh api "repos/$repo/git/ref/heads/$target_branch" --jq '.object.sha')" = "$target"
          echo 'PR65_INDEPENDENT_ROOT_AND_TWIN_PASS'
