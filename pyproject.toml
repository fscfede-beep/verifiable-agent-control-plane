[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verifiable-agent-control-plane"
version = "0.2.0"
description = "Runtime-dependency-free reference for fail-closed agent execution and receipt-bound state transitions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["verifiable_control_plane"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
